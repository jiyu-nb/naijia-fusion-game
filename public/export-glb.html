<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>export standin to GLB (local pipeline self-check only)</title>
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three/build/three.module.js",
          "three/addons/": "../vendor/three/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <p id="status">exporting…</p>
    <script type="module">
      import { buildStandinFrog } from "../src/three/standin.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

      const status = document.getElementById("status");
      try {
        const group = buildStandinFrog();
        group.name = "local-standin-frog";
        // 描边外壳用的是 BackSide，glTF 不保存 side，导出后会变成整只棕色；
        // 导出前移除反向外壳，只留彩色主体（Hi3D 真实 GLB 无此问题）。
        const shells = [];
        group.traverse((obj) => {
          if (obj.isMesh && obj.material && obj.material.side === 1 /* THREE.BackSide */) shells.push(obj);
        });
        shells.forEach((m) => m.parent && m.parent.remove(m));
        const exporter = new GLTFExporter();
        exporter.parse(
          group,
          (result) => {
            const bytes = new Uint8Array(result);
            let binary = "";
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
              binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            window.__glbBase64 = btoa(binary);
            window.__glbBytes = bytes.length;
            window.__ready = true;
            status.textContent = "ready " + bytes.length;
          },
          (err) => {
            window.__err = String(err);
            window.__ready = true;
            status.textContent = "error";
          },
          { binary: true },
        );
      } catch (err) {
        window.__err = String(err);
        window.__ready = true;
        status.textContent = "error " + err;
      }
    </script>
  </body>
</html>
